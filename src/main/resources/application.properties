spring.application.name=projet-spring

# XAMPP : MariaDB sur le port 3306. Les variables permettent une autre configuration.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/recensement}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Vérifie les tables existantes sans les recréer ni supprimer leurs données.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Les services chargent les relations nécessaires avant de construire la réponse.
spring.jpa.open-in-view=false

# Le dialecte legacy prend en charge MariaDB 10.4 fourni par XAMPP.
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect

# Affiche les requêtes produites par Hibernate dans la console.
spring.jpa.show-sql=true

# Produit une description OpenAPI 3.0.
springdoc.api-docs.version=OPENAPI_3_0
# Les annotations de chaque méthode décrivent ses véritables réponses d'erreur.
springdoc.override-with-generic-response=false

# Mettre à true pour actualiser les noms depuis l'API officielle, puis revenir à false.
application.init=false

# Rend ces trois endpoints Actuator accessibles sous /actuator.
management.endpoints.web.exposure.include=health,info,metrics
# Le contributeur env lit uniquement les propriétés commençant par info. pour /actuator/info.
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=API de recensement des villes de France
info.app.version=1.0
